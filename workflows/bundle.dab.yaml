bundle:
  name: carpark-realtime

resources:
  pipelines:
    carpark_dlt:
      name: carpark-dlt
      continuous: true
      development: false
      photon: true
      catalog: prd_fsr_catalog
      target: realtime
      libraries:
        - file: ../src/dlt/pipeline.py
      configuration:
        kafka.bootstrap: "{{secrets/carpark/kafka_bootstrap}}"
        kafka.username: "{{secrets/carpark/kafka_username}}"
        kafka.password: "{{secrets/carpark/kafka_password}}"
        kafka.topic: "carpark.raw"
      clusters:
        - label: default
          autoscale: {min_workers: 1, max_workers: 3, mode: ENHANCED}
          spark_version: "14.3.x-scala2.12"

targets:
  default:
    workspace:
      root_path: /Workspace/Repos/${workspace.current_user.userName}/carpark-rt
